<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1220"/>
      <stop offset="55%" stop-color="#111C31"/>
      <stop offset="100%" stop-color="#060A12"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7DD3FC"/>
      <stop offset="50%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1E3A8A"/>
    </linearGradient>
    <linearGradient id="mark" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#93C5FD"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="60%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <!-- plate -->
  <rect x="26" y="26" width="460" height="460" rx="122" fill="url(#plate)"/>
  <rect x="26" y="26" width="460" height="460" rx="122" fill="url(#sheen)"/>
  <rect x="32" y="32" width="448" height="448" rx="116" fill="none" stroke="url(#edge)" stroke-width="10"/>

  <!-- hidden orbit: the "loop" of continuous downloads -->
  <circle cx="256" cy="248" r="150" fill="none" stroke="#3B82F6" stroke-opacity="0.35" stroke-width="6" stroke-dasharray="8 26" stroke-linecap="round"/>
  <circle cx="256" cy="248" r="150" fill="none" stroke="#60A5FA" stroke-opacity="0.25" stroke-width="16" filter="url(#soft)"/>

  <!-- Monogram A whose counter is a downward arrow (hidden meaning: A = App, arrow = download) -->
  <g>
    <path d="M256 96 L372 356 H318 L296 302 H216 L194 356 H140 L256 96 Z" fill="url(#mark)"/>
    <!-- negative-space arrow inside the A -->
    <path d="M243 168 h26 v58 h26 l-39 48 -39 -48 h26 z" fill="#0B1220"/>
  </g>

  <!-- baseline: the "B" bar / download tray -->
  <rect x="176" y="386" width="160" height="22" rx="11" fill="url(#edge)"/>
  <rect x="176" y="386" width="160" height="22" rx="11" fill="#60A5FA" opacity="0.5" filter="url(#soft)"/>
</svg>
