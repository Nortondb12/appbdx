<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="glass-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="white" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="white" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0.8"/>
    </linearGradient>
    <filter id="blur-filter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="15" />
    </filter>
    <filter id="glow-filter">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Background Plate (Glass Effect) -->
  <rect x="20" y="20" width="472" height="472" rx="120" fill="url(#glass-grad)" stroke="url(#border-grad)" stroke-width="4"/>
  
  <!-- Subtle Internal Glow -->
  <path d="M140 100 Q256 60 372 100" stroke="white" stroke-width="2" stroke-opacity="0.2" fill="none"/>
  
  <!-- Main Icon: Modernized Download/Arrow Symbol -->
  <g filter="url(#glow-filter)">
    <!-- The "A" and Arrow Fusion -->
    <path d="M256 120L380 340H300V420H212V340H132L256 120Z" fill="white" fill-opacity="1"/>
    <path d="M256 160L340 310H280V390H232V310H172L256 160Z" fill="#60A5FA" fill-opacity="0.9"/>
  </g>
  
  <!-- Modern Accents -->
  <circle cx="256" cy="256" r="220" stroke="#3B82F6" stroke-width="1" stroke-dasharray="10 20" stroke-opacity="0.3"/>
  <rect x="60" y="60" width="392" height="392" rx="100" stroke="white" stroke-width="1" stroke-opacity="0.1"/>
</svg>
