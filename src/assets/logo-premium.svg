<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="glass-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="1"/>
      <stop offset="50%" stop-color="#93C5FD" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="1"/>
    </linearGradient>
    <filter id="glow-filter">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Background Plate (Glass Effect) -->
  <rect x="20" y="20" width="472" height="472" rx="120" fill="url(#glass-grad)" stroke="url(#border-grad)" stroke-width="8"/>
  
  <!-- Subtle Internal Glow -->
  <path d="M140 80 Q256 30 372 80" stroke="white" stroke-width="4" stroke-opacity="0.4" fill="none"/>
  
  <!-- Main Icon: Modernized Download/Arrow Symbol -->
  <g filter="url(#glow-filter)">
    <!-- The "A" and Arrow Fusion -->
    <path d="M256 120L380 340H300V420H212V340H132L256 120Z" fill="white" />
    <path d="M256 160L340 310H280V390H232V310H172L256 160Z" fill="#3B82F6" />
  </g>
  
  <!-- Modern Accents -->
  <circle cx="256" cy="256" r="230" stroke="#3B82F6" stroke-width="2" stroke-dasharray="20 30" stroke-opacity="0.5"/>
</svg>
